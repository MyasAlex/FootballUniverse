name: Compile Windows game (no PC compiler required)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Get sources
        uses: actions/checkout@v4
      - name: Configure with Visual Studio C++ compiler
        run: cmake -S . -B build-cloud -G "Visual Studio 17 2022" -A x64
      - name: Compile game and tests
        run: cmake --build build-cloud --config Release --parallel 2
      - name: Test game engine
        run: ctest --test-dir build-cloud -C Release --output-on-failure
      - name: Package portable EXE and resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'dist/FootballUniverse'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item 'build-cloud/Release/FootballUniverse.exe' "$folder/FootballUniverse.exe"
          Copy-Item 'data' "$folder/data" -Recurse
          Copy-Item 'assets' "$folder/assets" -Recurse
          @'
          @echo off
          cd /d "%~dp0"
          start "" "FootballUniverse.exe"
          '@ | Set-Content "$folder/PLAY.bat" -Encoding Ascii
          @'
          Football Universe 0.5 - Windows x64
          Run PLAY.bat or FootballUniverse.exe.
          C++ and Visual Studio are NOT required to run.
          Save files (career.fus) remain in the game folder if started through PLAY.bat.
          This is an early prototype. Windows GUI launch is checked in CI.
          '@ | Set-Content "$folder/READ_FIRST.txt" -Encoding UTF8
          @'
          @echo off
          cd /d "%~dp0"
          echo Checking Football Universe startup...
          if not exist "FootballUniverse.exe" (
            echo ERROR: FootballUniverse.exe is missing in this folder.
            pause
            exit /b 1
          )
          "FootballUniverse.exe"
          echo Exit code: %ERRORLEVEL%
          echo If the game failed to open, send a screenshot of this window.
          pause
          '@ | Set-Content "$folder/DIAGNOSE.bat" -Encoding Ascii
      - name: Smoke test the Windows desktop game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'dist/FootballUniverse').Path
          $exe = Join-Path $folder 'FootballUniverse.exe'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru
          try {
            $opened = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Milliseconds 400
              $proc.Refresh()
              if ($proc.HasExited) {
                if (Test-Path (Join-Path $folder 'fu_startup.log')) {
                  Get-Content (Join-Path $folder 'fu_startup.log') | ForEach-Object { Write-Host "TRACE: $_" }
                }
                throw "Game exited during startup with code $($proc.ExitCode)"
              }
              if ($proc.MainWindowHandle -ne 0) { $opened = $true; break }
            }
            if (-not $opened) {
              if (Test-Path (Join-Path $folder 'fu_startup.log')) {
                Get-Content (Join-Path $folder 'fu_startup.log') | ForEach-Object { Write-Host "TRACE: $_" }
              }
              throw 'Game did not open a main window within 10 seconds'
            }
            Write-Host "Desktop GUI launched successfully, HWND: $($proc.MainWindowHandle)"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Downloadable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FootballUniverse-Windows-EXE
          path: dist/FootballUniverse/*
          if-no-files-found: error
          retention-days: 30
