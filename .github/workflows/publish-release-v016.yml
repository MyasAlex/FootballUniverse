name: Publish Football Universe 0.16.0 Windows release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release-v016.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Release tested Windows build
    runs-on: ubuntu-latest
    steps:
      - name: Download previously tested Windows x64 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # This exact successful run is built from commit 080c20b and passed
          # Windows compilation, CTest and UI-layout smoke tests.
          run_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/41326392411" --jq '.head_sha')"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/41326392411" --jq '.conclusion')"
          test "$run_sha" = "080c20bff3ea72372eb8be368f4934c05fbd4bfd"
          test "$conclusion" = "success"
          gh run download 41326392411 --repo "$GITHUB_REPOSITORY" \
            --name FootballUniverse-Windows-EXE --dir dist/FootballUniverse

      - name: Verify offline database and prepare portable download
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/FootballUniverse/FootballUniverse.exe
          test -s dist/FootballUniverse/PLAY.bat
          test -s dist/FootballUniverse/data/world_players.csv
          test -s dist/FootballUniverse/data/world_players_meta.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("dist/FootballUniverse/data/world_players_meta.json").read_text(encoding="utf-8"))
          count = meta["players_written"]
          assert count >= 250000, f"Global catalogue is too small: {count}"
          print(f"Verified {count} offline footballer identity records")
          PY
          (cd dist/FootballUniverse && zip -q -r ../../FootballUniverse-0.16.0-Windows-x64.zip .)
          sha256sum FootballUniverse-0.16.0-Windows-x64.zip | tee SHA256SUMS.txt

      - name: Publish public GitHub Release and Windows ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'EOF'
          ## Football Universe 0.16.0 — World Football Database

          **Free early-access football management prototype for Windows 64-bit.**
          This release contains a tested portable EXE and the offline world footballer identity catalogue.

          ### What's included
          - **255,041 footballer identity records** from the open Reep dataset (CC0) across 268 countries and territories.
          - Search the world catalogue by name, country, position and age; view player profiles.
          - Sandbox option to add an identity to your simulated club (game attributes are fictional/generated).
          - Football club management: tactics, transfers, scouting, training, finances and board decisions.
          - Live text match commentary with a simple 2D pitch, adaptive opponent AI and match analytics.
          - Offline single-player gameplay, career saves and multiple management roles.

          **Data transparency:** The global catalogue is an identity directory, **not verified 2026/27 club rosters**, and not all catalogue entries are active players in the playable simulation. Some entries may have retired. The simulated league world currently includes 72 clubs. Football skills, player wages and contracts are generated by the game.

          ### Install / Запуск
          1. Download `FootballUniverse-0.16.0-Windows-x64.zip` below.
          2. Extract **all files** to a new folder on Windows x64.
          3. Run `PLAY.bat` or `FootballUniverse.exe`.
          4. Back up `career.fus` and the `saves` directory before carrying over a previous career.

          No internet connection or separate Visual C++ installation is required to play. This is an early prototype: please report bugs and feedback in GitHub Issues.

          **Testing:** Published archive originates from successful GitHub Actions run [41326392411](https://github.com/MyasAlex/FootballUniverse/actions/runs/41326392411) (Windows build, C++ engine tests, GUI smoke and panel-layout checks).

          **Source:** [MyasAlex/FootballUniverse](https://github.com/MyasAlex/FootballUniverse). Source code archives appear automatically under "Source code" on GitHub Releases.

          **World catalogue license:** Reep v0 dataset, CC0 1.0, source https://github.com/withqwerty/reep. Other third-party data acknowledgements are included in the game archive.
          EOF

          if gh release view v0.16.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.16.0 FootballUniverse-0.16.0-Windows-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.16.0 \
              FootballUniverse-0.16.0-Windows-x64.zip SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target 080c20bff3ea72372eb8be368f4934c05fbd4bfd \
              --title "Football Universe 0.16.0 — World Football Database" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
